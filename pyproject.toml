[project]
name = "football-match-prediction"
version = "0.1.0"
description = "Premier League match prediction pipeline, walk-forward model selection, and local dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    # 2.1.4 is the version Airflow 2.10.4 pins in its constraints file. Keeping the
    # floor there lets the project install alongside Airflow under those constraints.
    # Unconstrained installs still resolve to the newest pandas.
    "pandas>=2.1.4",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
spark = ["pyspark==4.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
# Bugs (pyflakes, bugbear) and security (bandit). Style is left to the existing code.
select = ["E9", "F", "B", "S"]
ignore = [
  "B905",  # zip(strict=) would change behaviour where lengths may differ on purpose
  "S608",  # reviewed 2026-11-11: SQL f-strings insert only code-defined fragments; every value is a %s parameter
  "S310",  # reviewed 2026-11-11: downloads use configured https URLs (football-data.co.uk, fixturedownload.com)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S108"]
"src/football_pipeline/spark_features.py" = ["S108"]  # Spark scratch dir inside the container
"src/football_pipeline/competitions.py" = ["S105"]    # ALL_TOKEN is the literal "all", not a password
